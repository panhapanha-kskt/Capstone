project:
  name: "DNS Traffic Anomaly Detection"
  version: "1.0.0"

paths:
  models_dir: "models"
  data_raw_dir: "data/raw"
  data_processed_dir: "data/processed"
  outputs_dir: "outputs"
  logs_dir: "logs"
  dns_logs_dir: "data/raw"

models:
  path_a:
    rf_file: "dns_tunnel_rf.pkl"
    transformer_file: "dns_tunnel_transformer.keras"
    scaler_file: "dns_scaler.pkl"
    threshold_file: "dns_threshold.json"
  path_b:
    model_name: "dns_trafficformer"
    model_file: "dns_trafficformer.h5"
    threshold_file: "dns_trafficformer_threshold.json"
    norm_file: "dns_trafficformer_norm.json"
  metadata_file: "training_metadata.json"
  provenance_file: "training_provenance.json"
  registry_file: "trained_files_registry.json"

training:
  path_b_window_size: 20
  path_b_threshold_percentile: 99   # Path B anomaly threshold = 99th pct of benign val error
  threshold_multiplier: 2.5         # only used by the mean+k·std fallback method
  sequence_length: 10               # Transformer baseline only
  # Path A alarm threshold: lowest score whose false-alarm rate on validation benign rows stays
  # within this budget (0.001 = 1 per 1,000). Also used by the learned fusion model.
  path_a_max_fpr: 0.001
  # Model inputs switched off for Path A and Path B (see PATH_A_FEATURES / PATH_B_FEATURES in
  # parsing/dns_parser.py). tunnel_rr_share_5m is off while benign data has no TXT/KEY/NULL
  # queries: on this data it re-encodes the record-type shortcut (ML_IMPROVEMENT_GUIDE Step 6).
  exclude_features: [tunnel_rr_share_5m]
  # Outlier capping for Path A: per-feature caps at the 0.1% / 99.9% quantiles of the TRAIN
  # rows, saved in dns_threshold.json and applied at inference. Rows are never removed —
  # tunnels are the extreme tail. 0 turns capping off.
  path_a_clip_quantile: 0.999

ensemble:
  # Path A production decision = RF + HistGradientBoosting soft-vote (50/50),
  # or RF-only if the combo doesn't beat RF on the held-out test (gate in path_a.py).
  # The Transformer is trained + reported as a baseline but excluded from the decision.
  path_a_models: [random_forest, hist_gradient_boosting]
  transformer_in_decision: false
  # Primary decision in fusion/bridge.py:
  #   "lr"    learned logistic-regression fusion V1 (scripts/train_fusion.py → models/fusion_lr.pkl)
  #   "lr_v2" fusion V2 (scripts/train_fusion.py --version 2 → models/fusion_lr_v2.pkl) — experimental,
  #           see docs/research/STACKER_V2_IMPLEMENTATION_REPORT.md (promotion gate not passed)
  #   "or"    legacy OR of the per-path labels (comparison / explicit choice)
  # A missing learned model stops the bridge in production; in development it falls back to "or".
  fusion: lr
  # production: missing Path A or fusion model is an error (fail closed).
  # development: OR fallback / degraded records are allowed and clearly marked (bridge --dev).
  bridge_mode: production
  # Path A / Path B weights of the legacy blend (bridge: ml_combined_score_legacy only — comparison)
  rf_weight: 0.6
  tf_weight: 0.4
  combined_threshold: 0.5

cleaning:
  # ingest/cleaning.py, run inside ingest/merge.py. Rejects only what cannot be a real DNS query;
  # odd characters (base64 tunnel payloads) and repeated queries are kept on purpose.
  max_name_length: 253              # RFC 1035
  max_label_length: 63
  drop_exact_packet_copies: true    # same name, timestamp, client IP + port, qtype, protocol
  ratio_features: [digit_ratio, numeric_ratio, unique_char_ratio]   # must lie in [0, 1]

labeling:
  # Step 8 of train_models.sh (src/dns_detect/ingest/labeling.py).
  # Behavioural labeling functions per parent domain; thresholds from DNS-tunneling research
  # (Farnham/SANS, Nadler et al. 2019, Ozery et al. NDSS 2024, Elastic/Zeek rules).
  manifest_skew_seconds: 2          # widen manifest windows for clock drift
  min_unique_subdomains: 50         # many_unique_subdomains / nxdomain_enumeration
  min_unique_ratio: 0.8             # unique subdomains ÷ queries (tunnel subdomains are queried once)
  min_information_chars: 4096       # high_information: unique chars sent through subdomains
  long_label_chars: 52              # long_encoded_labels: a label longer than this …
  long_subdomain_chars: 40          # … or a subdomain part at least this long …
  min_subdomain_entropy: 4.0        # … with at least this entropy (bits/char)
  min_share: 0.5                    # share of a parent's queries for long_encoded_labels / tunnel_record_types
  tunnel_record_min_subdomains: 20  # tunnel_record_types also needs this many unique subdomains
  nxdomain_share: 0.8               # nxdomain_enumeration: NXDOMAIN share for one client
  ordinary_max_subdomains: 10       # ordinary_domain (benign): few subdomains …
  ordinary_max_p95_length: 40       # … and short names
  min_attack_votes: 2               # attack needs this many attack LFs to agree
  window_seconds: 0                 # N9: window size for per-time-window per-parent stats; 0 keeps the whole-batch
                                    # behaviour so previous labeling output is byte-identical. Set e.g. 3600 (1h)
                                    # to make labels reproducible across runs that add/remove other data.

evaluation:
  # N2/N11/N13 — shared split manifests + 5-seed cross-validation. Driver: scripts/run_cv.py
  # Available strategies: exact_copy (current), capture_group, parent_domain_group, time, lofo.
  strategies: [exact_copy, capture_group, parent_domain_group, time, lofo]
  seeds: [42, 43, 44, 45, 46]
  splits_dir: "data/processed/splits"

detection:
  zscore_threshold: 2.0
  nxdomain_threshold: 200
  multi_client_threshold: 2
  tunneling_length_threshold: 100
  tunneling_entropy_threshold: 4.0
  subdomain_depth_threshold: 5
  ml_score_threshold: 0.7
  # Domains whose ML alarms are suppressed after fusion (score kept). Empty = no suppression.
  allowlist_path: config/detect_allowlist.txt
