# -----------------------------------------------------------------------------
# SUCCESS CRITERIA — what "better ML" looks like
# -----------------------------------------------------------------------------

success_metrics:
  must_have:
    external_holdout_pr_auc: ">= 0.80"
    leave_one_tool_out_recall_min: ">= 0.70 across >=3 unseen tools"
    cross_dataset_benign_fpr: "<= 5%"
    single_feature_shortcut_auc: "< 0.95 (down from 0.998)"
    expected_calibration_error: "<= 0.05"
    label_source: "manifest-only (circular fallback disabled)"
  should_have:
    adversarial_recall_under_length_matched: ">= 0.50"
    kitnet_pr_auc_vs_trafficformer_baseline: "KitNET >= Trafficformer"
    replay_test_in_ci: "passing on main"
    monitor_detects_induced_drift: "true"
  nice_to_have:
    doh_coverage_micro_model_reported: "true"
    per_host_risk_alert_consolidation: ">= 50% volume reduction"
    verdict_feedback_round_trip: "demonstrated end-to-end"

# -----------------------------------------------------------------------------
# RISKS & GUARDRAILS
# -----------------------------------------------------------------------------

risks:
  - name: "Data leakage via new aggregate features"
    description: |
      Per-domain / per-client aggregates computed over the FULL dataset
      leak test-set information into training rows. Compute aggregates
      WITHIN each split, not globally.
    mitigation: "Add an assertion in features/aggregates.py that split-id
                 of every input row equals split-id of the aggregate's
                 contributing rows."

  - name: "Label contamination from HITL verdicts"
    description: |
      If analysts rubber-stamp Approve, their verdicts poison the training
      set.
    mitigation: "Only verdicts from allowlisted approvers; one verdict per
                 alert per approver; 10% of verdicts re-audited by a second
                 approver before promotion."

  - name: "Overfitting new aggregates to lab topology"
    description: |
      `client_ip` and `source_subnet` features can memorize the lab's 4
      hosts. Report feature importances and drop any that leak the lab.
    mitigation: "After every training, assert no feature of the form
                 `client_ip*` or `subnet*` has importance > 0.1."

  - name: "KitNET compute cost on live traffic"
    description: |
      Ensembles are slower. If per-query inference latency breaks the
      near-real-time target, keep Trafficformer in production and KitNET
      offline for evaluation only.
    mitigation: "Measure P50/P99 inference latency per path; gate KitNET
                 behind a latency SLO."

# -----------------------------------------------------------------------------
# DELIVERABLES PER PRIORITY
# -----------------------------------------------------------------------------

deliverables:
  P0:
    - "models/evaluation_metrics.json → `external_holdout` block"
    - "data/processed/labeled_benign.json (≥50k queries, ≥3 hosts)"
    - "data/attack_manifest.csv (≥5 attack families)"
